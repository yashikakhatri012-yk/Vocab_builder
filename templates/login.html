{% extends "base.html" %}
{% block title %}Log in · Vocab Builder{% endblock %}
{% block content %}
<div class="auth-page" style="margin:-72px -36px -28px;min-height:calc(100vh + 100px)">
  <div class="auth-shell">
    <div class="auth-logo"><span class="brand-mark">V</span> Vocab Builder</div>
    <p class="eyebrow">YOUR DAILY LEARNING SPACE</p>
    <h1>Welcome back.</h1>
    <p class="lead">Pick up where your memory left off.</p>
    <form method="POST" class="auth-form">
      <div><label for="username">Email address</label><input id="username" type="email" name="username" placeholder="you@example.com" autocomplete="email" required></div>
      <div><label for="password">Password</label><input id="password" type="password" name="password" placeholder="Your password" autocomplete="current-password" required></div>
      <button class="button" type="submit">Continue <span>→</span></button>
    </form>
    <div class="auth-foot">New here? <a href="{{ url_for('signup') }}">Create your account</a></div>
  </div>
</div>
{% endblock %}
